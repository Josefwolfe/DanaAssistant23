name: Build Dana APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Generate Direct Activity Dana Code
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          find app/src/main -type f -name "*.kt" -delete
          mkdir -p app/src/main/java/ir/dana/assistant

          cat << 'EOF' > app/src/main/java/ir/dana/assistant/MainActivity.kt
          package ir.dana.assistant

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.*
          import android.database.Cursor
          import android.hardware.camera2.CameraManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity(), TextToSpeech.OnInitListener, RecognitionListener {
              private lateinit var statusText: TextView
              private lateinit var logBox: EditText
              private lateinit var btnListen: Button
              private var sr: SpeechRecognizer? = null
              private lateinit var rIntent: Intent
              private var tts: TextToSpeech? = null
              private var isListening = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(32, 32, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "دستیار صوتی دانا (نسخه مستقیم)"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 10)
                  }

                  statusText = TextView(this).apply {
                      text = "برای شروع روی دکمه بزنید"
                      textSize = 15f
                      setTextColor(Color.parseColor("#00E676"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  btnListen = Button(this).apply {
                      text = "🎤 شروع گوش دادن"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E88E5")); cornerRadius = 30f }
                      setOnClickListener {
                          toggleListening()
                      }
                  }

                  logBox = EditText(this).apply {
                      textSize = 13f
                      setTextColor(Color.parseColor("#B0BEC5"))
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(20, 20, 20, 20)
                      isFocusable = false
                      isClickable = true
                  }
                  
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      setPadding(0, 20, 0, 20)
                      addView(logBox)
                  }

                  layout.addView(title)
                  layout.addView(statusText)
                  layout.addView(btnListen)
                  layout.addView(scroll)
                  setContentView(layout)

                  tts = TextToSpeech(this, this)
                  checkPerms()
                  initRecognizer()
              }

              private fun checkPerms() {
                  val p = arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.CALL_PHONE, Manifest.permission.CAMERA)
                  val missing = p.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), 100)
                  }
              }

              private fun initRecognizer() {
                  try {
                      sr?.destroy()
                      sr = SpeechRecognizer.createSpeechRecognizer(this)
                      sr?.setRecognitionListener(this)
                      rIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "fa-IR")
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      }
                  } catch (e: Exception) {
                      log("خطا در راه‌اندازی میکروفون: ${e.message}")
                  }
              }

              private fun toggleListening() {
                  if (!isListening) {
                      try {
                          sr?.startListening(rIntent)
                          isListening = true
                          btnListen.text = "⏹️ در حال گوش دادن..."
                          statusText.text = "فرمان خود را بگویید..."
                      } catch (e: Exception) {
                          initRecognizer()
                          log("خطا در شروع: ${e.message}")
                      }
                  } else {
                      try {
                          sr?.stopListening()
                      } catch (e: Exception) {}
                      isListening = false
                      btnListen.text = "🎤 شروع گوش دادن"
                      statusText.text = "متوقف شد"
                  }
              }

              private fun log(msg: String) {
                  runOnUiThread {
                      logBox.append("$msg\n")
                  }
              }

              override fun onReadyForSpeech(params: Bundle?) { log("🎤 آماده دریافت صدا...") }
              override fun onBeginningOfSpeech() { log("🗣️ در حال صحبت...") }
              override fun onRmsChanged(rmsdB: Float) {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() { log("✋ پایان صحبت") }
              
              override fun onError(error: Int) {
                  log("⚠️ خطای صوت: $error")
                  isListening = false
                  btnListen.text = "🎤 شروع گوش دادن"
                  statusText.text = "خطا در تشخیص، دوباره تلاش کنید"
              }

              override fun onResults(results: Bundle?) {
                  isListening = false
                  btnListen.text = "🎤 شروع گوش دادن"
                  val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  val txt = matches?.firstOrNull()?.replace("ي", "ی")?.replace("ك", "ک")?.trim() ?: ""
                  
                  if (txt.isNotEmpty()) {
                      log("✅ فرمان: $txt")
                      statusText.text = "دستور: $txt"
                      handleCmd(txt)
                  } else {
                      statusText.text = "چیزی شنیده نشد"
                  }
              }

              override fun onPartialResults(partialResults: Bundle?) {
                  val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  val txt = matches?.firstOrNull()?.replace("ي", "ی")?.replace("ك", "ک")?.trim() ?: ""
                  if (txt.isNotEmpty()) {
                      statusText.text = "شنیده شد: $txt"
                  }
              }

              override fun onEvent(eventType: Int, params: Bundle?) {}

              private fun handleCmd(raw: String) {
                  val t = raw.replace("دانا", "").trim()
                  log("⚙️ اجرا: $t")

                  when {
                      t.contains("چراغ قوه") || t.contains("فلش") -> {
                          if (t.contains("خاموش")) {
                              setFlashlight(false)
                              speak("چراغ قوه خاموش شد")
                          } else {
                              setFlashlight(true)
                              speak("چراغ قوه روشن شد")
                          }
                      }
                      t.contains("هشدار") || t.contains("زنگ ساعت") || t.contains("آلارم") -> {
                          val numbers = t.replace(Regex("[^0-9]"), " ").trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                          val hour = if (numbers.isNotEmpty()) numbers[0].toIntOrNull() ?: 7 else 7
                          val min = if (numbers.size > 1) numbers[1].toIntOrNull() ?: 0 else 0
                          speak("هشدار تنظیم شد")
                          try {
                              startActivity(Intent(AlarmClock.ACTION_SET_ALARM).apply {
                                  putExtra(AlarmClock.EXTRA_HOUR, hour)
                                  putExtra(AlarmClock.EXTRA_MINUTES, min)
                                  putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              })
                          } catch (e: Exception) {}
                      }
                      t.contains("تماس") || t.contains("زنگ بزن") -> {
                          val name = t.replace("تماس بگیر", "").replace("تماس", "").replace("زنگ بزن", "").replace("به", "").replace("با", "").replace("ایرانسل", "").trim()
                          speak("برقراری تماس")
                          callContactByName(name)
                      }
                      t.contains("پیام") || t.contains("بگو") || t.contains("ایتا") -> {
                          val pkg = if (t.contains("تلگرام")) "org.telegram.messenger" else "ir.eitaa.messenger"
                          speak("باز کردن پیام‌رسان")
                          try {
                              packageManager.getLaunchIntentForPackage(pkg)?.let {
                                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(it)
                              }
                          } catch (e: Exception) {}
                      }
                      t.contains("بلوتوث") -> {
                          speak("تنظیمات بلوتوث")
                          startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                      t.contains("وای فای") || t.contains("اینترنت") -> {
                          speak("تنظیمات وای‌فای")
                          startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                      t.contains("اجرا کن") || t.contains("باز کن") -> {
                          val app = t.replace("برنامه", "").replace("رو", "").replace("را", "").replace("اجرا کن", "").replace("باز کن", "").trim()
                          if (openApp(app)) speak("باز شد") else speak("پیدا نشد")
                      }
                  }
              }

              private fun callContactByName(name: String) {
                  if (name.isEmpty()) return
                  var phoneNumber: String? = null
                  val cursor: Cursor? = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      null,
                      "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?",
                      arrayOf("%$name%"),
                      null
                  )
                  cursor?.use {
                      if (it.moveToFirst()) {
                          val idx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          if (idx >= 0) phoneNumber = it.getString(idx)
                      }
                  }
                  if (!phoneNumber.isNullOrEmpty()) {
                      try {
                          startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:$phoneNumber")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (e: Exception) {
                          startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:$phoneNumber")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                  } else {
                      speak("مخاطب پیدا نشد")
                  }
              }

              private fun setFlashlight(on: Boolean) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          cm.setTorchMode(cm.cameraIdList[0], on)
                      }
                  } catch (e: Exception) {}
              }

              private fun openApp(name: String): Boolean {
                  if (name.isEmpty()) return false
                  for (a in packageManager.getInstalledApplications(0)) {
                      val label = packageManager.getApplicationLabel(a).toString().lowercase()
                      if (label.contains(name.lowercase())) {
                          packageManager.getLaunchIntentForPackage(a.packageName)?.let {
                              startActivity(it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun speak(msg: String) {
                  tts?.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "id")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.setLanguage(Locale("fa", "IR"))
                  }
              }

              override fun onDestroy() {
                  try { sr?.destroy() } catch (e: Exception) {}
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dana-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
 
