              private fun handleCmd(raw: String) {
                  val t = raw.replace("ي", "ی").replace("ك", "ک").replace("دانا", "").trim()
                  ErrorCollector.log("⚙️ اجرای دستور: «$t»")

                  when {
                      // ۱. چراغ قوه
                      t.contains("چراغ قوه") || t.contains("فلش") -> {
                          if (t.contains("خاموش")) {
                              setFlashlight(false)
                              speak("چراغ قوه خاموش شد")
                          } else {
                              setFlashlight(true)
                              speak("چراغ قوه روشن شد")
                          }
                      }

                      // ۲. زنگ ساعت و هشدار
                      t.contains("هشدار") || t.contains("زنگ ساعت") || t.contains("آلارم") || (t.contains("ساعت") && (t.contains("فعال") || t.contains("کوک"))) -> {
                          var hour = 7
                          var min = 0
                          val numbers = t.replace(Regex("[^0-9]"), " ").trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                          if (numbers.isNotEmpty()) hour = numbers[0].toIntOrNull() ?: 7
                          if (numbers.size > 1) min = numbers[1].toIntOrNull() ?: 0

                          speak("هشدار برای ساعت $hour و $min تنظیم شد")
                          try {
                              startActivity(Intent(AlarmClock.ACTION_SET_ALARM).apply {
                                  putExtra(AlarmClock.EXTRA_HOUR, hour)
                                  putExtra(AlarmClock.EXTRA_MINUTES, min)
                                  putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              })
                          } catch (e: Exception) {}
                      }

                      // ۳. تماس صوتی با مخاطبین (مثل: تماس بگیر به گل پسرم ایرانسل)
                      t.contains("تماس") || t.contains("زنگ بزن") -> {
                          var name = t.replace("تماس بگیر", "").replace("تماس", "").replace("زنگ بزن", "").replace("به", "").replace("با", "").trim()
                          // حذف کلمات اضافی اپراتور یا لقب‌ها برای جستجوی دقیق‌تر در مخاطبین
                          name = name.replace("ایرانسل", "").replace("همراه اول", "").trim()
                          
                          speak("در حال جستجوی مخاطب و برقراری تماس")
                          callContactByName(name)
                      }

                      // ۴. ارسال پیام در ایتا یا تلگرام به مخاطب
                      t.contains("پیام") || t.contains("بگو") -> {
                          val pkg = if (t.contains("تلگرام")) "org.telegram.messenger" else "ir.eitaa.messenger"
                          val appName = if (pkg.contains("eitaa")) "ایتا" else "تلگرام"
                          
                          speak("در حال باز کردن $appName")
                          try {
                              val intent = packageManager.getLaunchIntentForPackage(pkg)
                              if (intent != null) {
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(intent)
                              }
                          } catch (e: Exception) {}
                      }

                      // ۵. بلوتوث و وای‌فای
                      t.contains("بلوتوث") -> {
                          speak("تنظیمات بلوتوث")
                          startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                      t.contains("وای فای") || t.contains("اینترنت") -> {
                          speak("تنظیمات وای‌فای")
                          startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }

                      // ۶. باز کردن برنامه‌ها
                      t.contains("اجرا کن") || t.contains("فعال کن") || t.contains("باز کن") -> {
                          val app = t.replace("برنامه", "").replace("رو", "").replace("را", "").replace("اجرا کن", "").replace("فعال کن", "").replace("باز کن", "").trim()
                          if (openApp(app)) speak("چشم، باز شد") else speak("برنامه پیدا نشد")
                      }
                  }

                  isAwake = false
                  listen(2000L)
              }

              // تابع جستجوی مخاطب و برقراری تماس واقعی
              private fun callContactByName(name: String) {
                  if (name.isEmpty()) return
                  var phoneNumber: String? = null
                  val cursor: Cursor? = contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      null,
                      "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?",
                      arrayOf("%$name%"),
                      null
                  )
                  cursor?.use {
                      if (it.moveToFirst()) {
                          val idx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          if (idx >= 0) phoneNumber = it.getString(idx)
                      }
                  }

                  if (!phoneNumber.isNullOrEmpty()) {
                      try {
                          val callIntent = Intent(Intent.ACTION_CALL, Uri.parse("tel:$phoneNumber")).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(callIntent)
                      } catch (e: Exception) {
                          // اگر مجوز مستقیم تماس نبود، اینتننت شماره‌گیر را باز کن
                          val dialIntent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$phoneNumber")).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(dialIntent)
                      }
                  } else {
                      speak("مخاطبی با نام $name در دفترچه تلفن پیدا نکردم")
                  }
              }
