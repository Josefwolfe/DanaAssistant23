name: Build Dana APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Generate Complete Final Dana Code
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          find app/src/main -type f -name "*.kt" -delete
          mkdir -p app/src/main/java/ir/dana/assistant

          cat << 'EOF' > app/src/main/java/ir/dana/assistant/MainActivity.kt
          package ir.dana.assistant

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.*
          import android.hardware.camera2.CameraManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          object ErrorCollector {
              private val logs = StringBuilder()
              var updateView: ((String) -> Unit)? = null
              fun log(msg: String) {
                  val timeLog = "[${System.currentTimeMillis() % 100000}] $msg\n"
                  logs.append(timeLog)
                  android.util.Log.d("DanaReport", msg)
                  updateView?.invoke(logs.toString())
              }
              fun getLogs(): String = logs.toString()
          }

          class MainActivity : Activity() {
              private lateinit var logBox: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(32, 32, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "دستیار صوتی هوشمند دانا (نسخه کامل)"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  logBox = EditText(this).apply {
                      textSize = 13f
                      setTextColor(Color.parseColor("#00E676"))
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(20, 20, 20, 20)
                      isFocusable = false
                      isClickable = true
                  }
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      addView(logBox)
                  }

                  val btnCopy = Button(this).apply {
                      text = "کپی گزارش وضعیت"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E88E5")); cornerRadius = 20f }
                      setOnClickListener {
                          val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cb.setPrimaryClip(ClipData.newPlainText("Logs", ErrorCollector.getLogs()))
                          Toast.makeText(this@MainActivity, "کپی شد!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(title); layout.addView(scroll); layout.addView(btnCopy)
                  setContentView(layout)

                  ErrorCollector.updateView = { text -> runOnUiThread { logBox.setText(text); scroll.fullScroll(ScrollView.FOCUS_DOWN) } }
                  checkPerms()
              }

              private fun checkPerms() {
                  val p = mutableListOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.CALL_PHONE, Manifest.permission.CAMERA)
                  if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = p.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) requestPermissions(missing.toTypedArray(), 100) else startDana()
              }

              private fun startDana() {
                  try {
                      val i = Intent(this, VoiceService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  } catch (e: Exception) { ErrorCollector.log("خطا: ${e.message}") }
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  if (c == 100) startDana()
              }
          }

          class VoiceService : Service(), TextToSpeech.OnInitListener {
              private var sr: SpeechRecognizer? = null
              private lateinit var rIntent: Intent
              private var tts: TextToSpeech? = null
              private val h = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
                  startFg()
                  initSR()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int = START_STICKY

              private fun initSR() {
                  h.post {
                      try {
                          sr?.destroy()
                          sr = SpeechRecognizer.createSpeechRecognizer(this)
                          rIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "fa-IR")
                              putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          }

                          sr?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(b: Bundle?) { ErrorCollector.log("🎤 آماده گوش دادن...") }
                              override fun onBeginningOfSpeech() { ErrorCollector.log("🗣️ در حال صحبت...") }
                              override fun onRmsChanged(v: Float) {}
                              override fun onBufferReceived(b: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onError(e: Int) {
                                  if (e != 7 && e != 6) ErrorCollector.log("⚠️ خطا: $e")
                                  listen(if (e == 8) 1000L else 300L)
                              }
                              override fun onResults(b: Bundle?) {
                                  val txt = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                                  if (txt.isNotEmpty()) {
                                      ErrorCollector.log("✅ فرمان دریافتی: «$txt»")
                                      handleCmd(txt)
                                  } else {
                                      listen(300L)
                                  }
                              }
                              override fun onPartialResults(b: Bundle?) {
                                  val p = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                                  if (p.isNotEmpty()) ErrorCollector.log("👂 شنیده شد: $p")
                              }
                              override fun onEvent(t: Int, b: Bundle?) {}
                          })
                          listen()
                      } catch (e: Exception) {}
                  }
              }

              private fun listen(delay: Long = 200L) {
                  h.postDelayed({
                      try {
                          sr?.cancel()
                          sr?.startListening(rIntent)
                      } catch (e: Exception) { initSR() }
                  }, delay)
              }

              private fun handleCmd(raw: String) {
                  val t = raw.replace("ي", "ی").replace("ك", "ک").trim()

                  when {
                      // ۱. ارسال پیام در پیام‌رسان‌ها (ایتا، روبیکا، تلگرام)
                      t.contains("پیام") || t.contains("بگو") || t.contains("ارسال کن") -> {
                          val pkg = when {
                              t.contains("ایتا") -> "ir.eitaa.messenger"
                              t.contains("روبیکا") -> "app.rbnet.rubika"
                              t.contains("تلگرام") -> "org.telegram.messenger"
                              else -> "ir.eitaa.messenger"
                          }
                          val appNameFa = when(pkg) {
                              "ir.eitaa.messenger" -> "ایتا"
                              "app.rbnet.rubika" -> "روبیکا"
                              else -> "تلگرام"
                          }
                          var msg = t.substringAfter("بگو").substringAfter("پیام").trim()
                          speak("در حال ارسال در $appNameFa")
                          try {
                              val intent = Intent().apply {
                                  action = Intent.ACTION_SEND
                                  putExtra(Intent.EXTRA_TEXT, msg.ifEmpty { "سلام" })
                                  type = "text/plain"
                                  setPackage(pkg)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                          } catch (e: Exception) {
                              packageManager.getLaunchIntentForPackage(pkg)?.let {
                                  it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(it)
                              }
                          }
                      }

                      // ۲. کنترل چراغ قوه
                      t.contains("چراغ قوه") || t.contains("فلش") -> {
                          if (t.contains("خاموش")) {
                              setFlashlight(false)
                              speak("چراغ قوه خاموش شد")
                          } else {
                              setFlashlight(true)
                              speak("چراغ قوه روشن شد")
                          }
                      }

                      // ۳. تنظیم زنگ ساعت
                      t.contains("زنگ ساعت") || t.contains("آلارم") -> {
                          var hour = 7; var min = 0
                          val nums = t.replace(Regex("[^0-9]"), " ").trim().split(Regex("\\s+"))
                          if (nums.isNotEmpty() && nums[0].isNotEmpty()) hour = nums[0].toIntOrNull() ?: 7
                          if (nums.size > 1 && nums[1].isNotEmpty()) min = nums[1].toIntOrNull() ?: 0
                          speak("زنگ ساعت برای ساعت $hour و $min تنظیم شد")
                          val intent = Intent(AlarmClock.ACTION_SET_ALARM).apply {
                              putExtra(AlarmClock.EXTRA_HOUR, hour)
                              putExtra(AlarmClock.EXTRA_MINUTES, min)
                              putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          try { startActivity(intent) } catch (e: Exception) {}
                      }

                      // ۴. تنظیم تایمر
                      t.contains("تایمر") -> {
                          var sec = 60
                          val nums = t.replace(Regex("[^0-9]"), " ").trim().split(Regex("\\s+"))
                          if (nums.isNotEmpty() && nums[0].isNotEmpty()) {
                              val n = nums[0].toIntOrNull() ?: 1
                              sec = if (t.contains("ساعت")) n * 3600 else n * 60
                          }
                          speak("تایمر تنظیم شد")
                          val intent = Intent(AlarmClock.ACTION_SET_TIMER).apply {
                              putExtra(AlarmClock.EXTRA_LENGTH, sec)
                              putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          try { startActivity(intent) } catch (e: Exception) {}
                      }

                      // ۵. وای‌فای و بلوتوث
                      t.contains("وای فای") || t.contains("اینترنت") -> {
                          speak("تنظیمات وای‌فای")
                          startActivity(Intent(Settings.ACTION_WIFI_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                      t.contains("بلوتوث") -> {
                          speak("تنظیمات بلوتوث")
                          startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }

                      // ۶. اعلام ساعت
                      t.contains("ساعت") -> {
                          val time = SimpleDateFormat("HH:mm", Locale("fa", "IR")).format(Date())
                          speak("ساعت اکنون $time است")
                      }

                      // ۷. جستجو در گوگل و آب و هوا
                      t.contains("جستجو") || t.contains("سرچ") -> {
                          val q = t.replace("دانا", "").replace("جستجو کن", "").replace("سرچ کن", "").trim()
                          speak("در حال جستجو")
                          startActivity(Intent(Intent.ACTION_WEB_SEARCH).apply {
                              putExtra(SearchManager.QUERY, q)
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          })
                      }
                      t.contains("آب و هوا") || t.contains("هوا") -> {
                          speak("بررسی آب و هوا")
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q=آب+و+هوا")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }

                      // ۸. باز کردن برنامه‌ها
                      t.contains("باز کن") || t.contains("اجرا کن") -> {
                          val app = t.replace("دانا", "").replace("برنامه", "").replace("را باز کن", "").replace("رو باز کن", "").replace("باز کن", "").trim()
                          if (openApp(app)) speak("باز شد") else speak("برنامه پیدا نشد")
                      }

                      // ۹. تماس صوتی
                      t.contains("زنگ بزن") || t.contains("تماس") -> {
                          val name = t.replace("دانا", "").replace("به", "").replace("با", "").replace("زنگ بزن", "").replace("تماس", "").trim()
                          call(name)
                      }
                  }
                  listen(1200L)
              }

              private fun setFlashlight(on: Boolean) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          val cm = getSystemService(Context.CAMERA_SERVICE) as CameraManager
                          cm.setTorchMode(cm.cameraIdList[0], on)
                      }
                  } catch (e: Exception) {}
              }

              private fun openApp(name: String): Boolean {
                  if (name.isEmpty()) return false
                  for (a in packageManager.getInstalledApplications(0)) {
                      if (packageManager.getApplicationLabel(a).toString().lowercase().contains(name.lowercase())) {
                          packageManager.getLaunchIntentForPackage(a.packageName)?.let {
                              startActivity(it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              return true
                          }
                      }
                  }
                  return false
              }

              private fun call(name: String) {
                  if (name.isEmpty()) return
                  val c = contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, "${ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME} LIKE ?", arrayOf("%$name%"), null)
                  c?.use {
                      if (it.moveToFirst()) {
                          val num = it.getString(it.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER))
                          startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:$num")).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }
                  }
              }

              private fun speak(msg: String) {
                  tts?.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "id")
              }

              override fun onInit(s: Int) {
                  if (s == TextToSpeech.SUCCESS) tts?.setLanguage(Locale("fa", "IR"))
              }

              private fun startFg() {
                  val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) mgr.createNotificationChannel(NotificationChannel("DanaCh", "Dana", NotificationManager.IMPORTANCE_LOW))
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "DanaCh") else @Suppress("DEPRECATION") Notification.Builder(this)
                  val n = b.setContentTitle("دستیار دانا").setContentText("در حال شنود...").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                  if (Build.VERSION.SDK_INT >= 30) startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(101, n)
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  sr?.destroy()
                  tts?.shutdown()
                  super.onDestroy()
              }
              override fun onBind(i: Intent?): IBinder? = null
          }
          EOF

      - name: Build Debug APK
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dana-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
