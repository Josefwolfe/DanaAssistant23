name: Build Dana APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Generate Reporter Code
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          find app/src/main -type f -name "*.kt" -delete
          mkdir -p app/src/main/java/ir/dana/assistant

          cat << 'EOF' > app/src/main/java/ir/dana/assistant/MainActivity.kt
          package ir.dana.assistant

          import android.Manifest
          import android.app.*
          import android.content.*
          import android.content.pm.*
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.provider.*
          import android.speech.*
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.*
          import java.util.Locale

          object ErrorCollector {
              private val logs = StringBuilder()
              var updateView: ((String) -> Unit)? = null

              fun log(msg: String) {
                  val timeLog = "[${System.currentTimeMillis() % 100000}] $msg\n"
                  logs.append(timeLog)
                  android.util.Log.d("DanaReport", msg)
                  updateView?.invoke(logs.toString())
              }
              fun getLogs(): String = logs.toString()
          }

          class MainActivity : Activity() {
              private lateinit var logBox: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#121212"))
                      setPadding(32, 32, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "گزارش‌گر خطاهای دستیار دانا"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  logBox = EditText(this).apply {
                      textSize = 13f
                      setTextColor(Color.parseColor("#00E676"))
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                      setPadding(20, 20, 20, 20)
                      isFocusable = false
                      isClickable = true
                  }
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      addView(logBox)
                  }

                  val btnCopy = Button(this).apply {
                      text = "کپی کردن گزارش خطاها"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E88E5")); cornerRadius = 20f }
                      setOnClickListener {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("DanaLogs", ErrorCollector.getLogs()))
                          Toast.makeText(this@MainActivity, "گزارش خطاها کپی شد!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layout.addView(title)
                  layout.addView(scroll)
                  layout.addView(btnCopy)
                  setContentView(layout)

                  ErrorCollector.updateView = { text -> runOnUiThread { logBox.setText(text); scroll.fullScroll(ScrollView.FOCUS_DOWN) } }
                  ErrorCollector.log("برنامه باز شد. در حال بررسی مجوزها...")

                  checkPerms()
              }

              private fun checkPerms() {
                  val p = mutableListOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.CALL_PHONE)
                  if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = p.filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) {
                      ErrorCollector.log("درخواست مجوزهای گمشده...")
                      requestPermissions(missing.toTypedArray(), 100)
                  } else {
                      ErrorCollector.log("همه مجوزها تایید شده‌اند. استارت سرویس...")
                      startDana()
                  }
              }

              private fun startDana() {
                  try {
                      val i = Intent(this, VoiceService::class.java)
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                      ErrorCollector.log("سرویس پس‌زمینه فراخوانی شد.")
                  } catch (e: Exception) {
                      ErrorCollector.log("خطا در استارت سرویس: ${e.message}")
                  }
              }

              override fun onRequestPermissionsResult(c: Int, p: Array<out String>, r: IntArray) {
                  if (c == 100) {
                      ErrorCollector.log("نتیجه مجوزها دریافت شد. استارت سرویس...")
                      startDana()
                  }
              }
          }

          class VoiceService : Service(), TextToSpeech.OnInitListener {
              private var sr: SpeechRecognizer? = null
              private lateinit var rIntent: Intent
              private var tts: TextToSpeech? = null
              private val h = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  ErrorCollector.log("VoiceService -> onCreate")
                  tts = TextToSpeech(this, this)
                  startFg()
                  initSR()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  ErrorCollector.log("VoiceService -> onStartCommand")
                  listen(300L)
                  return START_STICKY
              }

              private fun initSR() {
                  h.post {
                      try {
                          ErrorCollector.log("راه‌اندازی SpeechRecognizer...")
                          sr?.destroy()
                          sr = SpeechRecognizer.createSpeechRecognizer(this)
                          rIntent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "fa-IR")
                              putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          }
                          sr?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(b: Bundle?) { ErrorCollector.log("🎤 میکروفون آماده شنیدن است") }
                              override fun onBeginningOfSpeech() { ErrorCollector.log("🗣️ صدای کاربر شروع شد") }
                              override fun onRmsChanged(v: Float) {}
                              override fun onBufferReceived(b: ByteArray?) {}
                              override fun onEndOfSpeech() { ErrorCollector.log("⏳ پایان صحبت کاربر") }
                              override fun onError(e: Int) {
                                  ErrorCollector.log("⚠️ خطای تشخیص گفتار (کد خطا: $e)")
                                  if (e == 8 || e == 5) initSR()
                                  listen(if (e == 8) 1000L else 400L)
                              }
                              override fun onResults(b: Bundle?) {
                                  val txt = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                                  ErrorCollector.log("✅ متن دریافت شد: «$txt»")
                                  listen(400L)
                              }
                              override fun onPartialResults(b: Bundle?) {
                                  val p = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: ""
                                  if (p.isNotEmpty()) ErrorCollector.log("👂 شنیده شد: $p")
                              }
                              override fun onEvent(t: Int, b: Bundle?) {}
                          })
                          ErrorCollector.log("SpeechRecognizer با موفقیت تنظیم شد.")
                          listen(300L)
                      } catch (e: Exception) {
                          ErrorCollector.log("❌ خطا در ساخت SpeechRecognizer: ${e.message}")
                      }
                  }
              }

              private fun listen(delay: Long) {
                  h.removeCallbacksAndMessages(null)
                  h.postDelayed({
                      try {
                          sr?.cancel()
                          sr?.startListening(rIntent)
                          ErrorCollector.log("درخواست startListening ارسال شد.")
                      } catch (e: Exception) {
                          ErrorCollector.log("❌ خطا در startListening: ${e.message}")
                          initSR()
                      }
                  }, delay)
              }

              private fun startFg() {
                  try {
                      val mgr = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= 26) {
                          mgr.createNotificationChannel(NotificationChannel("DanaCh", "Dana", NotificationManager.IMPORTANCE_LOW))
                      }
                      val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "DanaCh") else @Suppress("DEPRECATION") Notification.Builder(this)
                      val n = b.setContentTitle("دانا").setContentText("در حال گزارش‌گیری...").setSmallIcon(android.R.drawable.ic_btn_speak_now).build()
                      if (Build.VERSION.SDK_INT >= 30) startForeground(101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE) else startForeground(101, n)
                      ErrorCollector.log("Foreground Service استارت شد.")
                  } catch (e: Exception) {
                      ErrorCollector.log("❌ خطا در Foreground Service: ${e.message}")
                  }
              }

              override fun onInit(s: Int) {
                  if (s == TextToSpeech.SUCCESS) {
                      tts?.setLanguage(Locale("fa", "IR"))
                      ErrorCollector.log("موتور TTS با موفقیت آماده شد.")
                  } else {
                      ErrorCollector.log("⚠️ خطا در راه‌اندازی موتور TTS")
                  }
              }

              override fun onDestroy() {
                  ErrorCollector.log("VoiceService -> onDestroy")
                  h.removeCallbacksAndMessages(null)
                  sr?.destroy()
                  tts?.shutdown()
                  super.onDestroy()
              }
              override fun onBind(i: Intent?): IBinder? = null
          }
          EOF

      - name: Build Debug APK
        run: |
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle*" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ]; then cd "$SUBDIR"; fi
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dana-Assistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
